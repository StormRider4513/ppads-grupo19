<!--tela de login de usuário e senha-->

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AuMiau Pet</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="loginContainer">
        <h1>AuMiau Pet</h1>
        <h2>Sistema de gestão para Pet Shop</h2>

        <div class="loginForm">
            <form action="#" method="POST">
                <div class="loginFormGroup">
                    <label for="usuario">Usuário:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" maxlength="10"
                        required />
                </div>

                <div class="loginFormGroup">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" maxlength="10"
                        required />
                </div>

                <div class="buttonLoginForm">
                    <button type="submit" class="botaoEntrar">Entrar</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
