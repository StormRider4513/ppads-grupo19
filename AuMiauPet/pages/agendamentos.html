<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - AuMiau Pet</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/agendamentos.css">
</head>

<body>

    <div class="app-container">

        <!-- Área onde a barra superior será carregada pelo layout.js -->
        <div id="topbar-container"></div>

        <div class="app-body">

            <!-- Área onde o menu lateral será carregado pelo layout.js -->
            <div id="sidebar-container"></div>

            <!-- Conteúdo principal da página -->
            <main class="main-content">

                <div class="agendamento-container">

                    <!-- O título muda para "Editar agendamento" quando necessário -->
                    <h2 id="titulo-agendamento">Agendar serviço</h2>

                    <form class="agendamento-form" action="#" method="POST">

                        <!-- Seleção do cliente -->
                        <div class="form-field">
                            <label for="cliente">Cliente:</label>

                            <select id="cliente" name="cliente" required>
                                <option value="" disabled selected>
                                    Selecionar cliente
                                </option>
                            </select>
                        </div>

                        <!-- Seleção do pet -->
                        <div class="form-field">
                            <label for="pet">Pet:</label>

                            <select id="pet" name="pet" required>
                                <option value="" disabled selected>
                                    Selecionar pet
                                </option>
                            </select>
                        </div>

                        <!-- Seleção do serviço -->
                        <div class="form-field">
                            <label for="servico">Serviço:</label>

                            <select id="servico" name="servico" required>
                                <option value="" disabled selected>
                                    Selecionar serviço
                                </option>
                            </select>
                        </div>

                        <!-- Escolha da data -->
                        <div class="form-field">
                            <label for="data">Data:</label>

                            <input
                                type="date"
                                id="data"
                                name="data"
                                placeholder="__/__/____"
                                required
                            />
                        </div>

                        <!-- Os horários são criados pelo JavaScript -->
                        <div class="form-field">

                            <label>Horários disponíveis:</label>

                            <div
                                class="horarios-group"
                                id="horarios-disponiveis">

                                <span class="mensagem-horarios">
                                    Escolha uma data
                                </span>

                            </div>

                        </div>

                        <!-- Botões da tela -->
                        <div class="form-actions">

                            <button
                                type="button"
                                class="btn-cancelar">
                                Cancelar
                            </button>

                            <button
                                type="submit"
                                class="btn-confirmar"
                                id="btn-confirmar-agendamento">
                                Confirmar agendamento
                            </button>

                        </div>

                    </form>

                </div>

            </main>

        </div>
    </div>

    <!-- Arquivos JavaScript usados pela página -->
    <script src="../js/layout.js"></script>
    <script src="../js/dados.js"></script>
    <script src="../js/agendamentos.js"></script>

</body>

</html>
