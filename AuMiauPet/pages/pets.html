<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pets - AuMiau Pet</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pets.css">
</head>

<body>

    <div class="app-container">

        <div id="topbar-container"></div>

        <div class="app-body">

            <div id="sidebar-container"></div>

            <main class="main-content">

                <section class="pets-container">

                    <h2>Pets</h2>

                    <form id="pesquisa-pets" class="pets-actions">

                        <input type="search" id="pesquisa-pet" placeholder="Pesquisar pelo nome do pet..."
                            aria-label="Pesquisar pelo nome do pet">

                        <button type="submit" class="pets-botao">
                            Pesquisar
                        </button>

                        <button type="button" id="novo-pet" class="pets-botao">
                            Cadastrar pet
                        </button>

                    </form>

                    <p id="mensagem-pesquisa" role="status"></p>

                    <div class="pets-tabela-container">

                        <table class="pets-tabela">

                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Espécie</th>
                                    <th>Raça</th>
                                    <th>Cliente responsável</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>

                            <tbody id="pets-body">

                                <tr>
                                    <td colspan="5">
                                        Nenhum pet cadastrado.
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

        </div>

    </div>


    <!-- MODAL CADASTRO / EDIÇÃO DE PET -->

    <dialog id="pet-dialog">

        <form id="form-pet">

            <h2 id="titulo-pet-modal">
                Cadastrar pet
            </h2>

            <div class="pets-campo">

                <label for="cliente-pet">
                    Cliente responsável:
                </label>

                <select id="cliente-pet" required>

                    <option value="" disabled selected>
                        Selecione o cliente
                    </option>

                </select>

            </div>


            <div class="pets-campo">

                <label for="nome-pet">
                    Nome do pet:
                </label>

                <input type="text" id="nome-pet" placeholder="Digite o nome do pet" required>

            </div>


            <div class="pets-campo">

                <label for="especie-pet">
                    Espécie:
                </label>

                <select id="especie-pet" required>

                    <option value="" disabled selected>
                        Selecione a espécie
                    </option>

                    <option value="Cachorro">
                        Cachorro
                    </option>

                    <option value="Gato">
                        Gato
                    </option>

                    <option value="Outro">
                        Outro
                    </option>

                </select>

            </div>


            <div class="pets-campo">

                <label for="raca-pet">
                    Raça:
                </label>

                <input type="text" id="raca-pet" placeholder="Digite a raça ou SRD">

            </div>


            <div class="pets-campo">

                <label for="nascimento-pet">
                    Data de nascimento:
                </label>

                <input type="date" id="nascimento-pet">

            </div>


            <p id="mensagem-pet" role="status"></p>


            <div class="pets-modal-actions">

                <button type="button" id="cancelar-pet" class="pets-botao pets-secundario">
                    Cancelar
                </button>

                <button type="submit" id="btn-salvar-pet" class="pets-botao">
                    Salvar pet
                </button>

            </div>

        </form>

    </dialog>


    <div id="pet-toast" role="status"></div>


    <script src="../js/layout.js"></script>
    <script src="../js/dados.js"></script>
    <script src="../js/pets.js"></script>

</body>

</html>
