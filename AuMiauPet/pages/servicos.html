<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serviços - AuMiau Pet</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/servicos.css">
</head>

<body>

    <div class="app-container">

        <div id="topbar-container"></div>

        <div class="app-body">

            <div id="sidebar-container"></div>

            <main class="main-content">

                <section class="servicos-container">

                    <div class="servicos-header">

                        <h2>Serviços</h2>

                        <button type="button" id="novo-servico" class="btn-principal">
                            Novo serviço
                        </button>

                    </div>


                    <div class="servicos-tabela-container">

                        <table class="servicos-tabela">

                            <thead>
                                <tr>
                                    <th>Serviço</th>
                                    <th>Descrição</th>
                                    <th>Valor</th>
                                    <th>Duração</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>

                            <tbody id="servicos-body"></tbody>

                        </table>

                    </div>

                </section>

            </main>

        </div>

    </div>


    <!-- MODAL -->

    <dialog id="servico-dialog">

        <form id="form-servico">

            <h2 id="titulo-servico-modal">
                Novo serviço
            </h2>


            <div class="servico-campo">

                <label for="nome-servico">
                    Nome
                </label>

                <input type="text" id="nome-servico" required>

            </div>


            <div class="servico-campo">

                <label for="descricao-servico">
                    Descrição
                </label>

                <textarea id="descricao-servico" rows="3"></textarea>

            </div>


            <div class="servico-campo">

                <label for="valor-servico">
                    Valor
                </label>

                <input type="number" id="valor-servico" min="0" step="0.01" required>

            </div>


            <div class="servico-campo">

                <label for="duracao-servico">
                    Duração em minutos
                </label>

                <input type="number" id="duracao-servico" min="1" required>

            </div>


            <div class="servico-actions">

                <button type="button" id="cancelar-servico" class="btn-secundario">
                    Cancelar
                </button>

                <button type="submit" class="btn-principal" id="salvar-servico">
                    Salvar serviço
                </button>

            </div>

        </form>

    </dialog>


    <div id="servico-toast" role="status"></div>


    <script src="../js/layout.js"></script>
    <script src="../js/servicos.js"></script>

</body>

</html>
